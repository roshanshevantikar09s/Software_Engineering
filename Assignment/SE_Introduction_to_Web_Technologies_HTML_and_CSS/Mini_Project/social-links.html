<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Links and Gamer Tag</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        /* Q1: Music Links Form */

        .container {
            max-width: 800px;
            margin: auto;
            padding: 30px;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        .input-box {
            position: relative;
            margin-bottom: 15px;
        }

        /* Q3: Platform icon inside input */

        .input-box img {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 25px;
            height: 25px;
        }

        .input-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 12px 12px 45px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }


        /* Q4: Preview Cards */

        .preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .preview-card {
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
            border: 3px solid;
        }

        .preview-card img {
            width: 50px;
            height: 50px;
        }

        .spotify {
            border-color: green;
        }

        .youtube {
            border-color: red;
        }

        .apple {
            border-color: black;
        }

        .visit-button {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }


        /* Q2: Gamer Tag Page */

        .gamer-section {
            margin-top: 50px;
            background-color: #171717;
            color: white;
            padding: 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
        }

        .gamer-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .gamer-buttons a {
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .twitch {
            background-color: #9146ff;
        }

        .discord {
            background-color: #5865f2;
        }

        .steam {
            background-color: #1b2838;
        }


        /* Responsive Design */

        @media (max-width: 700px) {

            .preview-container {
                grid-template-columns: 1fr;
            }

            .gamer-section {
                flex-direction: column;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>My Music & Social Links</h1>


        <!-- Q1 + Q3: Music Links Form -->

        <div class="form-box">

            <h2>Music Links</h2>

            <form id="musicLinksForm">

                <!-- Spotify -->

                <div class="input-box">

                    <img src="https://via.placeholder.com/25?text=S"
                         alt="Spotify">

                    <input type="url"
                           id="spotify"
                           placeholder="Spotify Profile URL"
                           required>

                </div>


                <!-- YouTube Music -->

                <div class="input-box">

                    <img src="https://via.placeholder.com/25?text=Y"
                         alt="YouTube Music">

                    <input type="url"
                           id="youtube"
                           placeholder="YouTube Music Profile URL"
                           required>

                </div>


                <!-- Apple Music -->

                <div class="input-box">

                    <img src="https://via.placeholder.com/25?text=A"
                         alt="Apple Music">

                    <input type="url"
                           id="apple"
                           placeholder="Apple Music Profile URL"
                           required>

                </div>


                <button type="submit">
                    Add Music Links
                </button>

            </form>

        </div>


        <!-- Q4: Preview Cards -->

        <div id="previewContainer"
             class="preview-container">

        </div>


        <!-- Q2: Gamer Tag -->

        <div class="gamer-section">

            <img src="https://via.placeholder.com/130"
                 class="avatar"
                 alt="Gamer Avatar">

            <div>

                <h2>ROSHAN GAMER</h2>

                <p>
                    🎮 Gamer | Streamer | Esports Lover
                </p>


                <div class="gamer-buttons">

                    <a href="#"
                       class="twitch"
                       target="_blank">
                        Twitch
                    </a>

                    <a href="#"
                       class="discord"
                       target="_blank">
                        Discord
                    </a>

                    <a href="#"
                       class="steam"
                       target="_blank">
                        Steam
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script>

        document.getElementById("musicLinksForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let spotify = document.getElementById("spotify").value;
            let youtube = document.getElementById("youtube").value;
            let apple = document.getElementById("apple").value;

            let container =
                document.getElementById("previewContainer");

            container.innerHTML = "";

            createCard(
                "Spotify",
                spotify,
                "spotify",
                "S"
            );

            createCard(
                "YouTube Music",
                youtube,
                "youtube",
                "Y"
            );

            createCard(
                "Apple Music",
                apple,
                "apple",
                "A"
            );

        });


        function createCard(platform, url, className, icon) {

            let username;

            try {

                let link = new URL(url);

                username =
                    link.pathname.split("/").filter(Boolean).pop()
                    || "Music Profile";

            } catch {

                username = "Music Profile";

            }


            let card =
                document.createElement("div");

            card.className =
                "preview-card " + className;


            card.innerHTML = `

                <img src="https://via.placeholder.com/50?text=${icon}"
                     alt="${platform}">

                <h3>${platform}</h3>

                <p>@${username}</p>

                <a href="${url}"
                   target="_blank"
                   class="visit-button">
                    Visit
                </a>

            `;


            document
                .getElementById("previewContainer")
                .appendChild(card);

        }

    </script>

</body>
</html>
