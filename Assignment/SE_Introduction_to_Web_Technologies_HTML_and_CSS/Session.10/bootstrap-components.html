<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Components Practical</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <!-- Q1: Spotify-style Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="#">My Music</a>

            <!-- Hamburger button for mobile -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Playlists</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Profile</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <div class="container mt-5">


        <!-- Q2: Flipkart Product Card -->

        <h2>Product Preview</h2>

        <div class="card" style="width: 18rem;">

            <img src="https://via.placeholder.com/300"
                 class="card-img-top"
                 alt="Product">

            <div class="card-body">

                <h5 class="card-title">Wireless Headphones</h5>

                <p class="card-text">
                    High-quality wireless headphones with clear sound.
                </p>

                <h5>₹1,499</h5>

                <a href="#" class="btn btn-primary">
                    Buy Now
                </a>

            </div>

        </div>


        <hr class="my-5">


        <!-- Q3: BookMyShow Carousel -->

        <h2>Featured Movies</h2>

        <div id="movieCarousel"
             class="carousel slide"
             data-bs-ride="carousel">

            <div class="carousel-inner">

                <!-- Movie 1 -->
                <div class="carousel-item active">

                    <img src="https://via.placeholder.com/800x400?text=Movie+1"
                         class="d-block w-100"
                         alt="Movie 1">

                    <div class="carousel-caption d-block">
                        <h5>Avengers: Endgame</h5>
                        <p>Action and Adventure</p>
                    </div>

                </div>


                <!-- Movie 2 -->
                <div class="carousel-item">

                    <img src="https://via.placeholder.com/800x400?text=Movie+2"
                         class="d-block w-100"
                         alt="Movie 2">

                    <div class="carousel-caption d-block">
                        <h5>Spider-Man</h5>
                        <p>Superhero Movie</p>
                    </div>

                </div>


                <!-- Movie 3 -->
                <div class="carousel-item">

                    <img src="https://via.placeholder.com/800x400?text=Movie+3"
                         class="d-block w-100"
                         alt="Movie 3">

                    <div class="carousel-caption d-block">
                        <h5>Batman</h5>
                        <p>Action Thriller</p>
                    </div>

                </div>

            </div>


            <!-- Previous Button -->
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>


            <!-- Next Button -->
            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>


        <hr class="my-5">


        <!-- Q4: Zomato Restaurant Review Form -->

        <h2>Restaurant Review</h2>

        <form>

            <div class="mb-3">

                <label for="name" class="form-label">
                    Name
                </label>

                <input type="text"
                       class="form-control"
                       id="name"
                       required>

            </div>


            <div class="mb-3">

                <label for="rating" class="form-label">
                    Rating
                </label>

                <select class="form-select"
                        id="rating"
                        required>

                    <option value="">Select Rating</option>
                    <option>1 Star</option>
                    <option>2 Stars</option>
                    <option>3 Stars</option>
                    <option>4 Stars</option>
                    <option>5 Stars</option>

                </select>

            </div>


            <div class="mb-3">

                <label for="review" class="form-label">
                    Review
                </label>

                <textarea class="form-control"
                          id="review"
                          rows="4"
                          placeholder="Write your review..."
                          required></textarea>

            </div>


            <button type="submit" class="btn btn-danger">
                Submit Review
            </button>

        </form>


        <hr class="my-5">


        <!-- Q5: Food Filter Buttons -->

        <h2>Food Filters</h2>

        <div class="btn-group">

            <button class="btn btn-primary active">
                All
            </button>

            <button class="btn btn-success">
                Veg
            </button>

            <button class="btn btn-danger">
                Non-Veg
            </button>

            <button class="btn btn-warning">
                Desserts
            </button>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
