<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and Grid Practical</title>

    <style>

        /* Q1: Social Media Icons using Flexbox */

        .social-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }

        .social-icons img {
            width: 60px;
            height: 60px;
        }


        /* Q2: Spotify Playlist using Flexbox */

        .playlist {
            display: flex;
            gap: 15px;
            background-color: #222;
            padding: 20px;
        }

        .song-card {
            display: flex;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 15px;
            width: 180px;
            height: 60px;
        }


        /* Q3: Flipkart Product Grid */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            border: 1px solid gray;
            padding: 15px;
            text-align: center;
        }

        .product-card img {
            width: 150px;
            height: 150px;
        }


        /* Q4: Responsive Product Grid */

        /* Tablet - 2 columns */
        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile - 1 column */
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>


    <!-- Q1: Social Icons -->

    <h1>My Favorite Apps</h1>

    <div class="social-icons">

        <img src="https://via.placeholder.com/60?text=Instagram"
             alt="Instagram">

        <img src="https://via.placeholder.com/60?text=WhatsApp"
             alt="WhatsApp">

        <img src="https://via.placeholder.com/60?text=Zomato"
             alt="Zomato">

        <img src="https://via.placeholder.com/60?text=Spotify"
             alt="Spotify">

    </div>


    <hr>


    <!-- Q2: Spotify Playlist -->

    <h1>Spotify Playlist</h1>

    <div class="playlist">

        <div class="song-card">
            <p>Perfect - Ed Sheeran</p>
        </div>

        <div class="song-card">
            <p>Believer - Imagine Dragons</p>
        </div>

        <div class="song-card">
            <p>Shape of You - Ed Sheeran</p>
        </div>

        <div class="song-card">
            <p>Kesariya - Arijit Singh</p>
        </div>

        <div class="song-card">
            <p>Heeriye - Jasleen Royal</p>
        </div>

    </div>


    <hr>


    <!-- Q3 & Q4: Product Grid -->

    <h1>Flipkart Product Grid</h1>

    <section class="product-grid">

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 1">
            <h3>Smartphone</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 2">
            <h3>Headphones</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 3">
            <h3>Smart Watch</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 4">
            <h3>Laptop</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 5">
            <h3>Camera</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 6">
            <h3>Bluetooth Speaker</h3>
        </div>

    </section>

</body>
</html>
