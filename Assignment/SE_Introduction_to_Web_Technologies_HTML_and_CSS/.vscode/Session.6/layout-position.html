<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout and Position Practical</title>

    <style>

        /* Q1: Zomato Restaurant Card */
        .restaurant-card {
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
            width: 300px;
        }

        .restaurant-name {
            border-bottom: 1px solid gray;
            padding: 10px;
        }

        .cuisine {
            padding: 10px;
        }

        .rating {
            padding: 10px;
        }


        /* Q2: Flipkart Product Tile */
        .product-tile {
            width: 300px;
            border: 1px solid gray;
            padding: 15px;
            margin: 20px;
        }

        .product-tile img {
            width: 200px;
            display: block;
        }

        .product-name {
            display: inline-block;
            font-size: 20px;
            margin-top: 10px;
        }

        .price {
            display: inline-block;
            color: green;
            font-size: 18px;
        }

        /* Add class "hide-price" to hide the price */
        .hide-price {
            display: none;
        }


        /* Q3: WhatsApp Fixed Notification */
        .whatsapp-badge {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: green;
            color: white;
            padding: 15px;
            margin: 10px;
            border-radius: 25px;
        }


        /* Q4: BookMyShow Movie Poster Grid */
        .movie-grid {
            display: flex;
            gap: 20px;
            margin: 20px;
        }

        .movie-poster {
            position: relative;
            width: 180px;
        }

        .movie-poster img {
            width: 180px;
            display: block;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            padding: 5px 10px;
        }


        /* Q5: Reusable class */
        .common-box {
            margin: 20px;
            padding: 15px;
        }

        /*
        Reusable class avoids writing the same margin and padding
        again and again. If we need to change spacing, we can
        change it in one place, making the CSS easier to maintain.
        */

    </style>

</head>

<body>

    <!-- Q1 -->
    <h1>Zomato Restaurant</h1>

    <div class="restaurant-card common-box">

        <div class="restaurant-name">
            <h2>Spice Garden</h2>
        </div>

        <div class="cuisine">
            <p>Cuisine: Indian, Chinese</p>
        </div>

        <div class="rating">
            <p>Rating: ⭐ 4.5/5</p>
        </div>

    </div>


    <hr>


    <!-- Q2 -->
    <h1>Flipkart Product</h1>

    <div class="product-tile common-box">

        <img src="https://via.placeholder.com/200"
             alt="Product Image">

        <span class="product-name">Wireless Headphones</span>

        <p class="price">₹1,499</p>

    </div>


    <hr>


    <!-- Q3 -->
    <div class="whatsapp-badge">
        💬 WhatsApp: Chat with us
    </div>


    <!-- Q4 -->
    <h1>BookMyShow Movies</h1>

    <div class="movie-grid">

        <div class="movie-poster">

            <span class="new-badge">NEW</span>

            <img src="https://via.placeholder.com/180x250"
                 alt="Movie Poster">

        </div>

        <div class="movie-poster">

            <img src="https://via.placeholder.com/180x250"
                 alt="Movie Poster">

        </div>

        <div class="movie-poster">

            <img src="https://via.placeholder.com/180x250"
                 alt="Movie Poster">

        </div>

    </div>

</body>
</html>
